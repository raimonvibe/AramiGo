# Tests must never touch a real database.
#
# The main config imports backend/.env for local convenience, which would
# otherwise point the test suite at production Postgres — the seeder writes and
# prunes on startup, so `mvn test` would mutate live data. Overriding the import
# to nothing keeps tests hermetic.
spring.config.import=

spring.datasource.url=jdbc:h2:mem:aramigo-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Sign-in stays disabled unless a test opts in.
aramigo.auth.google.client-id=
aramigo.cors.allowed-origins=http://localhost:3000
