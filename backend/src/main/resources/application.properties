spring.application.name=aramigo-api

# Local convenience: read backend/.env if it exists, treating it as a properties
# file. Real environment variables still win, so this changes nothing in
# production. Spring Boot does not pick up .env on its own without this line.
spring.config.import=optional:file:./.env[.properties]

# Render injects PORT; local default stays 8080.
server.port=${PORT:8080}

# Durable by default in production, throwaway H2 only when DATABASE_URL is unset.
# DATABASE_URL works with Neon, Supabase, Render Postgres or a local server, e.g.
#   jdbc:postgresql://host/db?user=...&password=...&sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:aramigo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# "update" keeps learner rows across restarts and deploys. Never "create-drop":
# that wipes every learner's progress each time the instance wakes up.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Free-tier databases idle their compute; a small pool that gives up quickly
# beats a big one that hangs the request while a cold instance wakes.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

# Neon-style Postgres bills compute while a connection is open, not per query,
# and suspends only after ~5 minutes with no connections at all. Hikari defaults
# minimum-idle to maximum-pool-size, which pins five sockets open for the life of
# the process — and keepalive.yml deliberately keeps that process alive around
# the clock, so the database never got to sleep even with no traffic. Draining to
# zero trades that for one reconnect plus a few hundred ms of wake-up on the
# first request after a lull.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=30000

# Local-only convenience; disabled unless explicitly turned on.
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# Comma-separated. Override in production, e.g.:
# ARAMIGO_CORS_ALLOWED_ORIGINS=https://aramaic.eu
aramigo.cors.allowed-origins=${ARAMIGO_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# OAuth client id from the Google Cloud console. Empty = sign-in disabled,
# everyone stays an anonymous guest and the app still works.
aramigo.auth.google.client-id=${GOOGLE_CLIENT_ID:}
