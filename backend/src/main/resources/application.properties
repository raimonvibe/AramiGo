spring.application.name=aramigo-api
server.port=8080

spring.datasource.url=jdbc:h2:mem:aramigo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop so content re-seeds cleanly while the curriculum is still small
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

aramigo.cors.allowed-origins=http://localhost:3000
