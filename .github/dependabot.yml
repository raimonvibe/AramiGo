# Forced Dependabot check: 2026-11-11T10:54:48Z
# Dependabot version updates — checks every Saturday (Europe/Amsterdam).
# Pushing this file also triggers an immediate first run on the default branch.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
