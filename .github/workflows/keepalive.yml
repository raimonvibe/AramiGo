name: Keep Render webapp awake

# Render's free web service plan spins the instance down after ~15 min of
# inactivity (cold start takes ~30-60s on the next request). Render Cron Jobs
# aren't free (min $1/mo), so this free GitHub Actions schedule pings /health
# often enough to keep the free instance warm.
#
# Setup (one-time, after the first Render deploy):
#   1. Push this repo to GitHub and enable Actions.
#   2. Repo Settings -> Secrets and variables -> Actions -> Variables
#      -> New repository variable
#        Name:  RENDER_APP_URL
#        Value: https://your-service.onrender.com   (no trailing slash)
#
# Point RENDER_APP_URL at whichever free Render *web service* sleeps —
# usually the Spring API. The workflow hits $RENDER_APP_URL/health.

on:
  schedule:
    # Every 10 minutes, against a ~15 min sleep window. GitHub delays
    # scheduled runs under load, sometimes past that margin, so the instance
    # does go to sleep occasionally — the ping below must be able to wake it
    # rather than time out on a cold start.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Ping Render health endpoint
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::RENDER_APP_URL repository variable is not set. See workflow comments for setup steps."
            exit 1
          fi

          # Strip a trailing slash so "$APP_URL/health" never becomes "//health".
          APP_URL="${APP_URL%/}"

          # --max-time has to exceed a cold start, not merely a warm response.
          # Whenever a scheduled run slips past the ~15 min sleep window, this
          # ping IS the request that wakes the instance, so it has to sit
          # through the boot it just triggered — 90s against a 30-60s start.
          #
          # --connect-timeout stays short because Render's edge accepts the
          # connection immediately even while the instance is down; a slow
          # connect means a wrong URL or a deleted service.
          #
          # Retries cover the brief 502/503 window while the container is up
          # but the app has not bound its port yet.
          #
          # `|| rc=$?` is load-bearing: GitHub runs this with `bash -e`, which
          # aborts on a failing command substitution unless it sits in a
          # tested context — and aborting here would skip the diagnostics.
          body=$(mktemp)
          rc=0
          result=$(curl -sS -o "$body" -w '%{http_code} %{time_total}' \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            "$APP_URL/health") || rc=$?
          read -r code seconds <<< "$result"

          if [ "$rc" -ne 0 ]; then
            case "$rc" in
              28) echo "::error::Timed out after ${seconds}s waiting for $APP_URL/health. A free-tier cold start answers within 30-60s, so exceeding 90s points at an unhealthy deploy — check the Render logs." ;;
              6|7) echo "::error::Could not reach $APP_URL (curl exit $rc). Check that RENDER_APP_URL matches the service's current URL." ;;
              *) echo "::error::curl failed with exit code $rc after ${seconds}s." ;;
            esac
            exit 1
          fi

          # No --fail: a non-200 from an awake instance deserves a different
          # message than a service that never responded at all.
          if [ "$code" != "200" ]; then
            echo "::error::$APP_URL/health answered HTTP $code in ${seconds}s — the instance is awake but unhealthy."
            cat "$body"; echo
            exit 1
          fi

          echo "Render app is awake — HTTP 200 in ${seconds}s."
          cat "$body"; echo
